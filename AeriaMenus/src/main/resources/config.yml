# ==========================================
#          AERIAMENUS - CONFIGURAÇÃO
# ==========================================

modulos:
  ativar-scoreboard: true
  ativar-tablist-animada: true
  ativar-actionbar-rotativa: true
  ativar-chat: true
  ativar-mensagens-entrada: true
  ativar-efeitos-entrada: true
  ativar-clima-sempre-dia: true
  ativar-protecoes: true
  dar-itens-ao-entrar: true
  usar-placeholderapi: true
  usar-vault: true

# Configuração da Scoreboard Lateral
bossbar:
  titulo: "&#00d4ff&lAERIA MENUS &8| &fBem-vindo, &a%player_name%"
  cor: "BLUE" 
  estilo: "SOLID" 
  progresso: 1.0

scoreboard:
  titulo: "<gradient:#00d4ff:#00ff55>&lAERIA MENUS</gradient>"
  linhas:
    - "&8&m                                   "
    - "&fPerfil:"
    - " &8• &7Jogador: &#00ff55%player_name%"
    - " &8• &7Cargo: &f%vault_rank%"
    - " &8• &7Moedas: &a$%vault_eco_balance_formatted%"
    - ""
    - "&fServidor:"
    - " &8• &7Online: &#ffaa00%server_online%&8/&7%server_max_players%"
    - " &8• &7Ping: &a%player_ping%ms"
    - ""
    - "&#00d4ffloja.aeriamenus.com"
    - "&8&m                                   "

tablist:
  tempo-atualizacao: 20
  header:
    - ""
    - "<gradient:#00d4ff:#00ff55>&lAERIA MENUS - REDE DE JOGOS</gradient>"
    - "&7Bem-vindo(a) de volta, &f%player_name%&7!"
    - ""
  footer:
    - ""
    - "&eAcesse nossa loja: &f&nloja.aeriamenus.com"
    - "&7Jogadores conectados: &a%server_online%"
    - ""

actionbar:
  tempo-entre-mensagens: 5
  mensagens:
    - "&eBem-vindo ao nosso Lobby Principal!"
    - "&aCompre VIP e ajude o servidor: &nloja.aeriamenus.com"
    - "&bUse a Bússola no seu inventário para jogar!"

protecoes:
  bloquear-quebra: true
  bloquear-colocacao: true
  bloquear-drop: true
  bloquear-fome: true
  bloquear-dano: true

# Configuração do Sistema de Spawn e Queda no Vazio
spawn:
  teleportar-ao-entrar: true
  altura-void: 10.0
  local:
    mundo: "lobby"
    x: 86.5
    y: 135.0
    z: 4.0
    yaw: 0.0
    pitch: 0.0

# Itens que o jogador recebe ao entrar no Lobby (Relógio na Direita)
itens-entrada:
  bussola:
    material: "COMPASS"
    slot: 4
    nome: "<gradient:#00d4ff:#00ff55>&lSELETOR DE SERVIDORES &7(Clique)</gradient>"
    lore:
      - "&7Clique com o botão direito para"
      - "&7abrir o menu principal da rede."
      - ""
      - "&e» Clique para abrir!"
    acoes:
      - "menu: principal"
      - "som: UI_BUTTON_CLICK"

  relogio:
    material: "CLOCK"
    slot: 8
    nome: "&a&lOcultar Jogadores &7(Clique)"
    lore:
      - "&7Clique com o botão direito para"
      - "&7alternar a visibilidade dos jogadores."
      - ""
      - "&e» Clique para alternar!"
    acoes:
      - "especial: alternar_visibilidade"
      - "som: UI_BUTTON_CLICK"