# ==========================================
#        AERIAMENUS - CONFIGURAÇÃO BASE
# ==========================================

modulos:
  dar-itens-ao-entrar: true  
  ativar-protecoes: true     
  ativar-scoreboard: true    
  ativar-bossbar: true
  ativar-chat: true          
  ativar-clima-sempre-dia: true
  ativar-mensagens-entrada: true
  ativar-efeitos-entrada: true
  usar-placeholderapi: true
  ativar-tablist-animada: true
  ativar-actionbar-rotativa: true

spawn:
  teleportar-ao-entrar: true
  altura-void: 0.0
  local:
    mundo: "world"
    x: 0.0
    y: 100.0
    z: 0.0
    yaw: 0.0
    pitch: 0.0

bossbar:
  titulo: "&#00d4ff&lAERIA MENUS &8| &fBem-vindo, &a%player_name%"
  cor: "BLUE" 
  estilo: "SOLID" 
  progresso: 1.0

scoreboard:
  titulo: "<gradient:#00d4ff:#00ff55>&lAERIA MENUS</gradient>"
  linhas:
    - "&7-------------------"
    - "&fOlá, &#00ff55%player_name%"
    - ""
    - "&fOnline: &#ffaa00%server_online%"
    - ""
    - "&fSuporte:"
    - "&#ff4444suporte.aeriamenus@gmail.com"
    - "&7-------------------"

tablist:
  tempo-atualizacao: 20
  header:
    - ""
    - "<gradient:#00d4ff:#00ff55>&lAERIA MENUS - REDE DE JOGOS</gradient>"
    - "&7Bem-vindo(a) de volta, &f%player_name%&7!"
    - ""
  footer:
    - ""
    - "&eAcesse nossa loja: &f&nloja.aeriamenus.com"
    - "&7Jogadores conectados: &a%server_online%"
    - ""

actionbar:
  tempo-entre-mensagens: 5
  mensagens:
    - "&eBem-vindo ao nosso Lobby Principal!"
    - "&aCompre VIP e ajude o servidor: &nloja.aeriamenus.com"
    - "&bUse a Bússola em seu inventário para jogar!"

protecoes:
  bloquear-quebra: true
  bloquear-colocacao: true
  bloquear-drop: true
  bloquear-fome: true
  bloquear-dano: true

itens-entrada:
  bussola:
    material: "COMPASS"
    slot: 4
    custom-model-data: 0
    nome: "&#ffaa00&lSELETOR DE SERVIDORES &7(Clique)"
    lore:
      - "&7Clique para abrir o menu."
    acoes:
      - "som: UI_BUTTON_CLICK"
      - "menu: principal"
  magica:
    material: "CLOCK"
    slot: 8
    custom-model-data: 0
    nome: "&#ff44ff&lOCULTAR JOGADORES &7(Clique)"
    lore:
      - "&7Clique para esconder ou mostrar"
      - "&7os outros jogadores."
    acoes:
      - "som: UI_BUTTON_CLICK"
      - "especial: alternar_visibilidade"