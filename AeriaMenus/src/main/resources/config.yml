# ==========================================
#          AERIAMENUS - CONFIGURAÇÃO
# ==========================================

modulos:
  ativar-scoreboard: true
  ativar-tablist-animada: true
  ativar-actionbar-rotativa: true
  ativar-chat: true
  ativar-mensagens-entrada: true
  ativar-efeitos-entrada: true
  ativar-clima-sempre-dia: true
  ativar-protecoes: true
  dar-itens-ao-entrar: true
  usar-placeholderapi: true
  usar-vault: true

# Configuração da Scoreboard Lateral
scoreboard:
  titulo: "<gradient:#00d4ff:#00ff55>&lCRAZZYCRAFTBR</gradient>"
  linhas:
    - "&7&m------------------------"
    - " &fPerfil:"
    - "  &8• &7Jogador: &b%player_name%"
    - "  &8• &7Cargo: &a%vault_rank%"
    - "  &8• &7Moedas: &e%vault_eco_balance_formatted%"
    - ""
    - " &fServidor:"
    - "  &8• &7Online: &a%online%&7/&220"
    - "  &8• &7Ping: &a%player_ping%ms"
    - ""
    - " <gradient:#00d4ff:#00ff55>jogar.crazzycraftbr.com</gradient>"
    - "&7&m------------------------"

# Configuração da Tablist (Tab)
tablist:
  tempo-atualizacao: 20
  header:
    - ""
    - "    <gradient:#00d4ff:#00ff55>&lREDE CRAZZYCRAFTBR</gradient>    "
    - "  &7Fica por dentro das novidades no nosso Discord!  "
    - ""
  footer:
    - ""
    - "  &fJogadores Online: &a%online% &7| &fPing: &a%player_ping%ms  "
    - "  &eLoja: &fcompra.crazzycraftbr.com  "
    - ""

# Configuração da ActionBar Rotativa (Acima do Inventário)
actionbar:
  tempo-entre-mensagens: 5
  mensagens:
    - "&eSeja bem-vindo à nossa rede de servidores!"
    - "&aUse a &b&lBÚSSOLA &ano seu inventário para selecionar um jogo."
    - "&dAdquira cargos e vantagens incríveis na nossa loja!"

# Configuração do Sistema de Spawn e Queda no Vazio
spawn:
  teleportar-ao-entrar: true
  altura-void: 10.0
  local:
    mundo: "lobby"
    x: 86.5
    y: 135.0
    z: 4.0
    yaw: 0.0
    pitch: 0.0

# Itens que o jogador recebe ao entrar no Lobby
itens-entrada:
  bussola:
    material: "COMPASS"
    slot: 4
    nome: "<gradient:#00d4ff:#00ff55>&lSELETOR DE SERVIDORES &7(Clique)</gradient>"
    lore:
      - "&7Clique com o botão direito para"
      - "&7abrir o menu principal da rede."
    acoes:
      - "comando: servidores"