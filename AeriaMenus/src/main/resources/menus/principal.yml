titulo: '<gradient:#00d4ff:#00ff55>Menu Principal</gradient>'
linhas: 3
comando:
  - "menu"
  - "principal"
  - "servidores"

itens:
  Skyblock:
    material: "GRASS_BLOCK"
    slot: 11
    nome: "<gradient:#00ff55:#00ffff>&lSKYBLOCK EVOLUÇÃO</gradient>"
    lore:
      - "&7Crie a sua ilha flutuante,"
      - "&7evolua e domine a economia."
      - "Invada Bases Inimigas!"
      - "&7Seja bem-vindo ao nosso Skyblock!"
      - ""
      - "&fJogadores: &a%bungee_skyblock%"
      - ""
      - "&e» Clique para jogar!"
    acoes:
      - "servidor: skyblock"
      - "som: UI_BUTTON_CLICK"

  Minigames:
    material: "DIAMOND_SWORD"
    slot: 13
    nome: "<gradient:#ffaa00:#ff3333>&lMINIGAMES</gradient>"
    lore:
      - "&7Divirta-se em nossos modos"
      - "&7de jogo totalmente customizados."
      - ""
      - "&fJogadores: &a%bungee_minigames%"
      - ""
      - "&e» Clique para jogar!"
    acoes:
      - "servidor: minigames"
      - "som: UI_BUTTON_CLICK"

  Survival:
    material: "DIAMOND_PICKAXE"
    slot: 15
    nome: "<gradient:#ff00ff:#ffaa00>&lSURVIVAL</gradient>"
    lore:
      - "&7Explore um mundo aberto,"
      - "&7construa vilas e faça clãs."
      - ""
      - "&fJogadores: &a%bungee_survival%"
      - ""
      - "&e» Clique para jogar!"
    acoes:
      - "servidor: survival"
      - "som: UI_BUTTON_CLICK"

