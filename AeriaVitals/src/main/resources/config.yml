settings:
  update-tick-rate: 20 # Execução da task a cada 20 ticks (1 segundo)

infection:
  zombie-bite-chance: 35.0 # Chance base de infectar sem imunidade
  decay-per-second: 0.05 # Quanto diminui a infecção naturalmente se imunidade estiver alta
  effects:
    level-1:
      trigger-percentage: 50.0
    level-2:
      trigger-percentage: 80.0

# Inserir no bloco 'temperature' existente
temperature:
  base-body-temperature: 36.5 # Temperatura corporal normal
  heat-damage-threshold: 39.5 # Acima disso, toma dano de calor
  cold-damage-threshold: 35.0 # Abaixo disso, toma dano de frio
  cold-chance-percentage: 5.0 # Chance de pegar resfriado se estiver molhado e com frio
  biomes:
    DESERT: 4.0
    BADLANDS: 3.5
    SNOWY_PLAINS: -4.0
    SNOWY_TAIGA: -3.5
    ICE_SPIKES: -5.0
    NETHER_WASTES: 10.0
  modifiers:
    night-penalty: -1.0
    rain-penalty: -1.5
    water-modifier: -2.5
    near-fire: 5.0

modules:
  weight: true
  thirst: true
  bleeding: true
  radiation: true

