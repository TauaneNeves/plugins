settings:
  update-tick-rate: 20 # Execução da task a cada 20 ticks (1 segundo)

infection:
  zombie-bite-chance: 35.0 # Chance base de infectar sem imunidade
  decay-per-second: 0.05 # Quanto diminui a infecção naturalmente se imunidade estiver alta
  effects:
    level-1:
      trigger-percentage: 50.0
    level-2:
      trigger-percentage: 80.0

# Inserir no bloco 'temperature' existente
temperature:
  base-body-temperature: 36.5 # Temperatura corporal normal
  heat-damage-threshold: 39.5 # Acima disso, toma dano de calor
  cold-damage-threshold: 35.0 # Abaixo disso, toma dano de frio
  cold-chance-percentage: 5.0 # Chance de pegar resfriado se estiver molhado e com frio
  biomes:
    DESERT: 4.0
    BADLANDS: 3.5
    SNOWY_PLAINS: -4.0
    SNOWY_TAIGA: -3.5
    ICE_SPIKES: -5.0
    NETHER_WASTES: 10.0
  modifiers:
    night-penalty: -1.0
    rain-penalty: -1.5
    water-modifier: -2.5
    near-fire: 5.0

# Substituir o bloco custom-items.antibiotic existente
custom-items:
  antibiotic:
    material: "SUGAR"
    custom-model-data: 1001
    display-name: "&aAntibiótico Geral"
    infection-reduction: 30.0
    immunity-boost: 10.0
    use-message: "&aVocê tomou o Antibiótico. Infecção reduzida e Resfriado curado!"
    lore:
      - "&7Reduz a infecção em 30%"
      - "&7Cura Resfriado/Gripe"
  syringe:
    syringe:
    material: "FEATHER"
    custom-model-data: 15002
    display-name: "&cSeringa de Adrenalina"
    infection-reduction: 0.0
    immunity-boost: 40.0
    use-message: "&cVocê injetou Adrenalina. Imunidade temporariamente aumentada!"
    lore:
      - "&7Aumenta a imunidade em 40%"
      # --- INÍCIO DA ADIÇÃO ---
weight:
  default-max-weight: 50.0
  backpacks:
    leather_backpack:
      display-name: "&6Mochila de Couro"
      bonus-weight: 25.0
    military_backpack:
      display-name: "&5Mochila Militar"
      bonus-weight: 60.0
  items:
    STONE: 0.5
    COBBLESTONE: 0.4
    IRON_INGOT: 0.3
    GOLD_INGOT: 0.4
    DIAMOND: 0.1
